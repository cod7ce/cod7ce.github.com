name: Build and Deploy

on:
  push:
    branches: [master]
    paths-ignore: [README.md, LICENSE]
  # 版本号和安装包体积是构建时从 GitHub Releases 现取的，
  # 所以即使站点源码没动，也每天重建一次让它跟上最新的 Release。
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          # 带上 token，GitHub API 的限额从每小时 60 次提到 1000 次
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
